<section class="max-w-[1280px] mx-auto px-5 lg:px-20 pb-24 grid md:grid-cols-2 gap-16">

    <h2 class="font-black text-3xl lg:text-section tracking-tighter" data-pt="O problema" data-en="The problem"></h2>
    <p class="mt-8 text-lg leading-relaxed"
       data-pt="Crianças sentem muito e nomeiam pouco. Quando o que elas sentem é minimizado por adultos, o que sobra é insegurança — e, mais tarde, dificuldade de se expressar. Faltam livros que tratem emoção como assunto, não como lição de moral."
       data-en="Children feel a lot and can name little. When what they feel gets dismissed by adults, what's left is insecurity — and later, difficulty expressing themselves. There's a shortage of books that treat emotion as a subject rather than a moral lesson."></p>
  </div>
  <div>
    <h2 class="font-black text-3xl lg:text-section tracking-tighter" data-pt="A resposta" data-en="The response"></h2>
    <p class="mt-8 text-lg leading-relaxed"
       data-pt="Um livro ilustrado para crianças de 6 a 11 anos e seus responsáveis, com escrita simples e personagens carismáticos. A Luna encontra o Monstrinho — que muda de cor conforme o que ela sente — e aprende a dar nome às próprias emoções."
       data-en="An illustrated book for children aged 6 to 11 and their caregivers, with simple writing and charismatic characters. Luna meets the Monstrinho — who changes colour according to what she feels — and learns to name her own emotions."></p>
  </div>
</section>

           data-en="years old: the age range defined from research on emotional development and autonomy in childhood."></p>

           data-pt="conceito final na banca de defesa, com indicação ao Repositório Digital da UNESP."
           data-en="final grade at the thesis defence, with a nomination for UNESP's Digital Repository."></p>
      </div>
    </div>

    <p class="mt-16 max-w-[60ch] leading-relaxed opacity-80"
       data-pt="A fundamentação passou por história da literatura infantil, o papel da ilustração na narrativa e a relação entre autoestima e gestão de frustrações. Entre os similares analisados, “O Monstro das Cores”, de Anna Llenas, que usa cor para representar emoção — e inspirou diretamente a criação do Monstrinho."
       data-en="The theoretical grounding covered the history of children's literature, the role of illustration in narrative, and the relationship between self-esteem and handling frustration. Among the references analysed was Anna Llenas' “The Colour Monster”, which uses colour to represent emotion — and directly inspired the Monstrinho."></p>
  </div>
</section>

<script>
  (function () {
    const btn = document.getElementById('lang-toggle');
    let lang = localStorage.getItem('lang') || 'pt';
    function apply(l) {
      document.querySelectorAll('[data-pt]').forEach(el => { el.textContent = el.dataset[l]; });
      document.documentElement.lang = l === 'pt' ? 'pt-BR' : 'en';
      btn.textContent = l === 'pt' ? 'EN' : 'PT';
      localStorage.setItem('lang', l);
    }
    btn.addEventListener('click', () => { lang = lang === 'pt' ? 'en' : 'pt'; apply(lang); });
    apply(lang);
  })();
</script>
